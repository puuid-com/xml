name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # `prepare` compiles Paraglide messages and generates Cloudflare types.
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
